name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src launch.py
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src launch.py
  package:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CodexProjectRescue --paths src launch.py
      - name: Check the standalone window with an empty temporary profile
        shell: pwsh
        run: ./scripts/smoke_windows.ps1
      - run: python scripts/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodexProjectRescue-Windows-preview
          path: |
            dist/CodexProjectRescue-*-windows-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 14
  portable-package:
    runs-on: ${{ matrix.os }}
    needs: portable-tests
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tk runtime on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CodexProjectRescue --paths src launch.py
      - run: python scripts/package_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodexProjectRescue-${{ runner.os }}-preview
          path: |
            dist/CodexProjectRescue-*.zip
            dist/SHA256SUMS-*.txt
          retention-days: 14
