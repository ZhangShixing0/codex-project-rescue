name: 恢复问题
description: 提交匿名诊断，帮助完善恢复范围
body:
  - type: markdown
    attributes:
      value: 请勿上传 .codex、备份、数据库、账号 ID、路径、会话或含私人信息的截图。仅提供工具导出的匿名诊断。
  - type: input
    id: versions
    attributes:
      label: 工具、Windows 和 Codex 版本
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 出现问题的阶段
      options:
        - 扫描
        - 查看预览
        - 应用修复
        - 打开 Codex 核验
        - 撤销
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 实际现象与匿名诊断
      description: 描述错误提示和匿名数量，不粘贴原始状态。
    validations:
      required: true
